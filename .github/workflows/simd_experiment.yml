name: SIMD Experiment

# Builds, tests and benchmarks the packages with SIMD fast paths, both plain
# and with GOEXPERIMENT=simd plus the simd build tag, on amd64 and
# arm64. It is not a required check: it produces the benchstat artifacts that
# the viability gate in doc/design-docs/SIMDOptimizations.md is judged on, and
# it catches drift in the experimental simd API early. Regular release builds
# set neither opt-in.
#
# The build-and-test job runs on every pull request that touches these
# packages. The bench job is a 10x500ms benchstat matrix on two runners, so
# on pull requests it only runs when the "Benchmark me" label is present; it
# always runs on pushes to main and on workflow_dispatch.
#
# A label event shares the concurrency group with the push that preceded
# it, so it cancels whatever is in flight for the ref; the build-and-test
# job therefore runs on label events too, rather than leaving the head SHA
# without a result.

on:
  push:
    branches:
      - "main"
    paths:
      - "go/bytes2/**"
      - "go/sqltypes/**"
      - "go/mysql/collations/**"
      - "go/vt/sqlparser/**"
      - "tools/benchstat/**"
      - "Makefile"
      - ".github/workflows/simd_experiment.yml"
  pull_request:
    branches: "**"
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "go/bytes2/**"
      - "go/sqltypes/**"
      - "go/mysql/collations/**"
      - "go/vt/sqlparser/**"
      - "tools/benchstat/**"
      - "Makefile"
      - ".github/workflows/simd_experiment.yml"
  workflow_dispatch:
    inputs:
      count:
        description: "Benchmark repetitions per cell (-count)"
        default: "10"
      benchtime:
        description: "Time per benchmark run (-benchtime)"
        default: "500ms"
      fuzztime:
        description: "Time per kernel fuzz target (-fuzztime)"
        default: "30s"

concurrency:
  group: format('{0}-{1}', ${{ github.ref }}, 'SIMD Experiment')
  cancel-in-progress: true

permissions: read-all

env:
  # The benchmarks that the viability gate compares. -bench matches each
  # slash-separated name component separately, so a top-level name matches
  # all of its sub-benchmarks.
  BENCH_PATTERN: "^(BenchmarkByteSetIndex|BenchmarkIndexAny2|BenchmarkEncodeSQL|BenchmarkEncodeSQLReference|BenchmarkGenerateQueryStringBinds|BenchmarkGenerateQueryCorpus|BenchmarkGenerateQueryTail|BenchmarkParseTail|BenchmarkTokenizerScanString|BenchmarkTokenizerScanStringReference|BenchmarkCollateSharedPrefix|BenchmarkCollationCollate|BenchmarkParse3|BenchmarkNormalizeVTGate)$"
  BENCH_PACKAGES: "./go/bytes2/... ./go/sqltypes/... ./go/mysql/collations/colldata/... ./go/vt/sqlparser/..."
  # The packages that carry a SIMD fast path. collations/integration is left
  # out because its TestMain needs a live MySQL.
  SIMD_PACKAGES: "./go/bytes2/... ./go/sqltypes/... ./go/mysql/collations/charset/... ./go/mysql/collations/colldata/... ./go/mysql/collations/internal/... ./go/vt/sqlparser/..."

jobs:
  bench:
    name: "Bench (${{ matrix.arch }})"
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'Benchmark me')
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ github.repository == 'vitessio/vitess' && (matrix.arch == 'arm64' && 'oracle-vm-16cpu-64gb-arm64' || 'oracle-vm-16cpu-64gb-x86-64') || (matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04') }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Skip CI
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'Skip CI') }}" == "true" ]]; then
            echo "skipping CI due to the 'Skip CI' label"
            exit 1
          fi

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Set up Go
        uses: $/.github/actions/setup-go

      - name: Run benchmarks (plain build)
        env:
          COUNT: ${{ inputs.count || '10' }}
          BENCHTIME: ${{ inputs.benchtime || '500ms' }}
        run: |
          set -exo pipefail
          go test -run '^$' -bench "${BENCH_PATTERN}" -count="${COUNT}" -benchtime="${BENCHTIME}" -benchmem -timeout 80m ${BENCH_PACKAGES} | tee plain.txt

      - name: Run benchmarks (experimental SIMD)
        env:
          COUNT: ${{ inputs.count || '10' }}
          BENCHTIME: ${{ inputs.benchtime || '500ms' }}
          GOEXPERIMENT: simd
        run: |
          set -exo pipefail
          go test -tags simd -run '^$' -bench "${BENCH_PATTERN}" -count="${COUNT}" -benchtime="${BENCHTIME}" -benchmem -timeout 80m ${BENCH_PACKAGES} | tee simd.txt

      - name: Compare with benchstat
        run: |
          set -exo pipefail
          go tool -modfile=tools/benchstat/go.mod benchstat plain.txt simd.txt | tee benchstat.txt
          {
            echo "## benchstat: plain vs experimental SIMD (${{ matrix.arch }})"
            echo '```'
            cat benchstat.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: "!cancelled()"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ matrix.arch }}
          path: |
            plain.txt
            simd.txt
            benchstat.txt

  simd-build-test:
    name: "Build and test (experimental SIMD, ${{ matrix.arch }})"
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ github.repository == 'vitessio/vitess' && (matrix.arch == 'arm64' && 'oracle-vm-16cpu-64gb-arm64' || 'oracle-vm-16cpu-64gb-x86-64') || (matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04') }}
    env:
      GOEXPERIMENT: simd

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Skip CI
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'Skip CI') }}" == "true" ]]; then
            echo "skipping CI due to the 'Skip CI' label"
            exit 1
          fi

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Set up Go
        uses: $/.github/actions/setup-go

      - name: Build the whole tree under the experiment
        run: |
          set -exo pipefail
          make build-experimental-simd NOVTADMINBUILD=1

      - name: Vet the SIMD packages
        run: |
          set -exo pipefail
          go vet -tags simd ${SIMD_PACKAGES}

      - name: Test the SIMD packages
        run: |
          set -exo pipefail
          go test -tags simd -timeout 10m ${SIMD_PACKAGES}

      # GODEBUG=simd=128 caps the vector width, so amd64 also exercises the
      # 128-bit lane count that arm64 NEON uses.
      - name: Test the SIMD packages at 128-bit vectors
        if: matrix.arch == 'amd64'
        env:
          GODEBUG: simd=128
        run: |
          set -exo pipefail
          go test -tags simd -timeout 10m ${SIMD_PACKAGES}

      # Every kernel is fuzzed against its scalar reference under the
      # experiment, per the adoption policy in
      # doc/design-docs/SIMDOptimizations.md. The test steps above replay only
      # the seed corpus: reaching generated inputs needs -fuzz, which takes one
      # package and one target per run.
      - name: Fuzz the kernels against their scalar references
        env:
          FUZZTIME: ${{ inputs.fuzztime || '30s' }}
        run: |
          set -exo pipefail
          # -list confirms the target is still there before fuzzing it: a
          # -fuzz regexp that matches nothing exits 0, so a renamed target
          # would leave this step green having fuzzed nothing. grep must not
          # be -q, which exits at the first match and races go test into a
          # SIGPIPE that pipefail then adopts as the pipeline's status.
          fuzz() {
            go test -tags simd -list "^$1\$" "$2" | grep -x "$1" >/dev/null
            go test -tags simd -run '^$' -fuzz "^$1\$" -fuzztime "${FUZZTIME}" "$2"
          }
          fuzz FuzzByteSetIndex ./go/bytes2/
          fuzz FuzzIndexAny2 ./go/bytes2/
          fuzz FuzzEncodeBytesSQL ./go/sqltypes/
          fuzz FuzzEqualASCIIPrefix ./go/mysql/collations/internal/uca/
          fuzz FuzzScanString ./go/vt/sqlparser/
